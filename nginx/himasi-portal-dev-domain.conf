# Nginx: HIMASI Portal — DEV DOMAIN (dev.himasi-utbogor.com)
# Serve static dari frontend/dist + SPA fallback. Jangan proxy / ke Vite (5173).
#
# Pasang:
#   sudo ln -sf /apps/himasi-portal/nginx/himasi-portal-dev-domain.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sebelum: cd /apps/himasi-portal/frontend && npm run build
# Backend harus jalan di 127.0.0.1:3001 (PM2/systemd).
#
# Jika path project beda, ubah baris "root" di bawah (satu baris saja).

server {
    listen 80;
    listen [::]:80;
    server_name dev.himasi-utbogor.com;

    # Edit path ini jika deploy tidak di /apps/himasi-portal
    root /apps/himasi-portal/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Root path: pastikan index.html di-serve
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # SPA: semua path lain fallback ke index.html
    location / {
        try_files $uri $uri/ /index.html?$args;
        add_header Cache-Control "no-cache";
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
