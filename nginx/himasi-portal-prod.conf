# Nginx: HIMASI Portal — PRODUCTION
# Serve static frontend (build) + proxy /api ke backend.
# Pasang: sudo ln -sf /apps/himasi-portal/nginx/himasi-portal-prod.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# Sebelum deploy: cd frontend && npm run build | cd backend && npm run build
# Backend jalan sebagai service (systemd/PM2) di 127.0.0.1:3001

# Ganti root dan server_name sesuai deploy
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /apps/himasi-portal/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 10M;

    # API → backend (Hono)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Static assets (cache)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Optional: health / nginx status
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
